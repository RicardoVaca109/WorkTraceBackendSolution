<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Evaluación del Servicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        .tech-title {
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 8px;
        }

        .form-title {
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .question {
            margin-bottom: 12px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            height: 160px;
            touch-action: none;
            background: #fff;
            cursor: crosshair;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            button:hover {
                background: #125ca1;
            }

        .btn-clear {
            margin-top: 8px;
            background: #777;
        }
    </style>
</head>

<body>
    <h2>Evaluación del Servicio</h2>

    <div id="evaluationContainer"></div>

    <div class="card">
        <div class="form-title">Comentarios adicionales</div>
        <textarea id="clientComment" rows="3"
                  style="width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; box-sizing: border-box;"
                  placeholder="Comentarios opcionales..."></textarea>
    </div>

    <div class="card">
        <p><strong>Firma del cliente</strong></p>
        <canvas id="signature" width="320" height="160"></canvas>
        <button type="button" class="btn-clear" onclick="clearSignature()">Limpiar firma</button>
    </div>

    <button onclick="submitEvaluation()">Enviar evaluación</button>

    <script>
        const API_URL = "https://worktraceapi.onrender.com";
        const token = sessionStorage.getItem("clientToken");
        const assignmentId = sessionStorage.getItem("assignmentId");

        let evaluationData = null;

        /* ===============================
           CARGAR FORMULARIOS
        ================================ */
        async function loadEvaluation() {
            try {
                const res = await fetch(
                    `${API_URL}/api/ClientEvaluation/form/${assignmentId}`,
                    { headers: { "X-Client-Token": token } }
                );

                if (!res.ok) throw new Error("Error al cargar formulario");

                evaluationData = await res.json();
                renderEvaluation(evaluationData);
            } catch (error) {
                alert("No se pudo cargar la evaluación.");
            }
        }

        function renderEvaluation(data) {
            const container = document.getElementById("evaluationContainer");
            container.innerHTML = "";

            data.evaluations.forEach((e, idx) => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                        <div class="tech-title">${e.technicianName}</div>
                        <div class="form-title">${e.formName}</div>
                        ${e.questions.map((q, qIdx) => `
                            <div class="question">
                                <label>${q.questionText}</label>
                                <input
                                    type="${q.answerType === 2 ? 'number' : 'text'}"
                                    data-tech="${idx}"
                                    data-question="${qIdx}"
                                    placeholder="${q.answerType === 2 ? '1 - 5' : 'Respuesta...'}"
                                    ${q.answerType === 2 ? 'min="1" max="5" step="1"' : ''}
                                />
                            </div>
                        `).join("")}
                    `;

                container.appendChild(card);
            });
        }

        /* ===============================
           FIRMA
        ================================ */
        const canvas = document.getElementById("signature");
        const ctx = canvas.getContext("2d");
        let drawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: x - rect.left, y: y - rect.top };
        }

        function startDraw(e) {
            if (e.type.includes("touch")) e.preventDefault();
            drawing = true;
            const { x, y } = getPos(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function moveDraw(e) {
            if (!drawing) return;
            if (e.type.includes("touch")) e.preventDefault();
            const { x, y } = getPos(e);
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000";
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function endDraw(e) {
            if (e.type.includes("touch")) e.preventDefault();
            drawing = false;
            ctx.beginPath();
        }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", moveDraw);
        canvas.addEventListener("mouseup", endDraw);
        canvas.addEventListener("mouseleave", endDraw);

        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", moveDraw, { passive: false });
        canvas.addEventListener("touchend", endDraw, { passive: false });

        /* ===============================
           SUBMIT
        ================================ */
        async function submitEvaluation() {
            if (!evaluationData) return;

            // Validar firma
            const empty = document.createElement("canvas");
            empty.width = canvas.width;
            empty.height = canvas.height;
            if (canvas.toDataURL() === empty.toDataURL()) {
                alert("Por favor firme antes de enviar.");
                return;
            }

            // Validar respuestas 1-5
            for (let i = 0; i < evaluationData.evaluations.length; i++) {
                const e = evaluationData.evaluations[i];
                for (let j = 0; j < e.questions.length; j++) {
                    const q = e.questions[j];
                    const input = document.querySelector(
                        `input[data-tech="${i}"][data-question="${j}"]`
                    );
                    const val = input.value;

                    if (q.answerType === 2) {
                        const num = Number(val);
                        if (!Number.isInteger(num) || num < 1 || num > 5) {
                            alert(`La respuesta "${q.questionText}" debe ser un número entre 1 y 5`);
                            input.focus();
                            return;
                        }
                    }
                }
            }

            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));

            const formData = new FormData();
            formData.append("AssignmentId", assignmentId);
            formData.append("FormType", evaluationData.evaluations[0].formTemplateId);
            formData.append("SignedBy", "CLIENTE");
            formData.append("ClientSignature", blob, "firma.png");
            formData.append("ClientComment", document.getElementById("clientComment").value || "");

            evaluationData.evaluations.forEach((e, i) => {
                formData.append(`UserEvaluations[${i}].UserId`, e.technicianId);
                e.questions.forEach((q, j) => {
                    const input = document.querySelector(
                        `input[data-tech="${i}"][data-question="${j}"]`
                    );
                    const val = input.value || "";

                    formData.append(`UserEvaluations[${i}].Answers[${j}].QuestionKey`, q.questionKey);
                    formData.append(`UserEvaluations[${i}].Answers[${j}].QuestionValue`, q.questionText);
                    formData.append(`UserEvaluations[${i}].Answers[${j}].AnswerType`, q.answerType);
                    formData.append(`UserEvaluations[${i}].Answers[${j}].Answer`, val);

                    if (q.answerType === 2) {
                        formData.append(`UserEvaluations[${i}].Answers[${j}].NumericValue`, val || "0");
                    }
                });
            });

            try {
                const res = await fetch(`${API_URL}/api/ClientEvaluation/submit`, {
                    method: "POST",
                    headers: { "X-Client-Token": token },
                    body: formData
                });

                if (res.ok) {
                    alert("Evaluación enviada correctamente");
                } else {
                    alert(await res.text());
                }
            } catch (err) {
                alert("Error de conexión");
            }
        }

        loadEvaluation();
    </script>
</body>
</html>
