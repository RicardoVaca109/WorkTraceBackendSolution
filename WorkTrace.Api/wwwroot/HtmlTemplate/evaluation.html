<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Evaluación del Servicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        .tech-title {
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 8px;
        }

        .form-title {
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .question {
            margin-bottom: 12px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* Asegura que el padding no desborde */
        }

        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            height: 160px;
            touch-action: none; /* Crucial para evitar scroll nativo */
            background: #fff;
            cursor: crosshair;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            button:hover {
                background: #125ca1;
            }
    </style>
</head>

<body>
    <h2>Evaluación del Servicio TATAT</h2>

    <div id="evaluationContainer"></div>

    <div class="card">
        <div class="form-title">Comentarios adicionales</div>
        <textarea id="clientComment" rows="3" style="width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; box-sizing: border-box;" placeholder="Comentarios opcionales..."></textarea>
    </div>

    <div class="card">
        <p><strong>Firma del cliente</strong></p>
        <canvas id="signature" width="320" height="160"></canvas>
    </div>

    <button onclick="submitEvaluation()">Enviar evaluación</button>

    <script>
        const API_URL = "https://worktraceapi.onrender.com";
        const token = sessionStorage.getItem("clientToken");
        const assignmentId = sessionStorage.getItem("assignmentId");

        let evaluationData = null;

        /* ===============================
           CARGAR FORMULARIOS
        ================================ */
        async function loadEvaluation() {
            try {
                const res = await fetch(
                    `${API_URL}/api/ClientEvaluation/form/${assignmentId}`,
                    { headers: { "X-Client-Token": token } }
                );

                if (!res.ok) throw new Error("Error al cargar formulario");

                evaluationData = await res.json();
                renderEvaluation(evaluationData);
            } catch (error) {
                console.error(error);
                alert("No se pudo cargar la evaluación.");
            }
        }

        function renderEvaluation(data) {
            const container = document.getElementById("evaluationContainer");
            container.innerHTML = ""; // Limpiar por si acaso

            data.evaluations.forEach((e, idx) => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="tech-title">${e.technicianName}</div>
                    <div class="form-title">${e.formName}</div>
                    ${e.questions.map((q, qIdx) => `
                        <div class="question">
                            <label>${q.questionText}</label>
                            <input
                                type="${q.answerType === 2 ? 'number' : 'text'}"
                                data-tech="${idx}"
                                data-question="${qIdx}"
                                placeholder="${q.answerType === 2 ? '1 - 5' : 'Respuesta...'}"
                                ${q.answerType === 2 ? 'min="1" max="5"' : ''}
                                onfocus="this.style.border='1px solid #ccc'"
                                ${q.answerType === 2 ? `oninput="this.value=this.value.replace(/[^1-5]/g,'').slice(0,1)"` : ''}
                            />
                        </div>
                    `).join("")}
                `;

                container.appendChild(card);
            });
        }

        /* ===============================
           FIRMA (MOUSE + TOUCH)
        ================================ */
        const canvas = document.getElementById("signature");
        const ctx = canvas.getContext("2d");
        let drawing = false;
        let hasSigned = false;

        // Función unificada para obtener coordenadas
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Soporte para touch o mouse
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Iniciar trazo
        function startDraw(e) {
            if (e.type === 'touchstart') e.preventDefault(); // Evita scroll
            drawing = true;
            hasSigned = true;
            const { x, y } = getPos(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Mover trazo
        function moveDraw(e) {
            if (!drawing) return;
            if (e.type === 'touchmove') e.preventDefault(); // Evita scroll

            const { x, y } = getPos(e);
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000";
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // Terminar trazo
        function endDraw(e) {
            if (e.type === 'touchend') e.preventDefault();
            drawing = false;
            ctx.beginPath(); // Reset path
        }

        // Eventos Ratón
        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", moveDraw);
        canvas.addEventListener("mouseup", endDraw);
        canvas.addEventListener("mouseleave", endDraw);

        // Eventos Táctiles (Con passive: false)
        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", moveDraw, { passive: false });
        canvas.addEventListener("touchend", endDraw, { passive: false });

        /* ===============================
           SUBMIT
        ================================ */
        async function submitEvaluation() {
            const btn = document.querySelector("button[onclick='submitEvaluation()']");
            if (!evaluationData) return;

            // 1. Validar Firma
            if (!hasSigned) {
                alert("Por favor, firme la evaluación antes de enviar.");
                return;
            }

            // 2. Validar Respuestas
            let isValid = true;
            let firstInvalidInput = null;

            // Resetear estilos previos
            document.querySelectorAll('input').forEach(i => i.style.border = "1px solid #ccc");

            evaluationData.evaluations.forEach((e, i) => {
                e.questions.forEach((q, j) => {
                    const input = document.querySelector(
                        `input[data-tech="${i}"][data-question="${j}"]`
                    );
                    const val = input.value.trim();

                    // Validar requerido
                    if (!val) {
                        input.style.border = "2px solid red";
                        isValid = false;
                        if (!firstInvalidInput) firstInvalidInput = input;
                    } 
                    // Validar rango numérico
                    else if (q.answerType === 2) {
                        const numVal = parseInt(val, 10);
                        if (isNaN(numVal) || numVal < 1 || numVal > 5) {
                            input.style.border = "2px solid red";
                            isValid = false;
                            if (!firstInvalidInput) firstInvalidInput = input;
                        }
                    }
                });
            });

            if (!isValid) {
                alert("Por favor, complete todos los campos correctamente. Las calificaciones deben ser entre 1 y 5.");
                if (firstInvalidInput) firstInvalidInput.focus();
                return;
            }

            // Deshabilitar botón para evitar doble envío
            btn.disabled = true;
            btn.innerText = "Enviando...";

            // Convertir canvas a Blob
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

            const formData = new FormData();
            formData.append("AssignmentId", assignmentId);
            // Asumiendo que todos usan el mismo template, tomamos el del primero
            formData.append("FormType", evaluationData.evaluations[0].formTemplateId);
            formData.append("SignedBy", "CLIENTE");
            formData.append("ClientSignature", blob, "firma.png");

            // Agregar comentario del cliente
            const comment = document.getElementById("clientComment").value || "";
            formData.append("ClientComment", comment);

            // Recorrer evaluaciones y preguntas
            evaluationData.evaluations.forEach((e, i) => {
                formData.append(`UserEvaluations[${i}].UserId`, e.technicianId);

                e.questions.forEach((q, j) => {
                    const input = document.querySelector(
                        `input[data-tech="${i}"][data-question="${j}"]`
                    );

                    // Validar que se haya respondido
                    const val = input.value;

                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].QuestionKey`,
                        q.questionKey
                    );
                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].QuestionValue`,
                        q.questionText
                    );
                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].AnswerType`,
                        q.answerType
                    );

                    // SIEMPRE enviar Answer (incluso si es numérico) para satisfacer validación [Required]
                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].Answer`,
                        val || ""
                    );

                    // Si es numérico, enviamos TAMBIÉN NumericValue
                    if (q.answerType === 2) {
                        formData.append(
                            `UserEvaluations[${i}].Answers[${j}].NumericValue`,
                            val || "0"
                        );
                    }
                });
            });

            try {
                const res = await fetch(`${API_URL}/api/ClientEvaluation/submit`, {
                    method: "POST",
                    headers: { "X-Client-Token": token },
                    body: formData
                });

                if (res.ok) {
                    alert("Evaluación enviada correctamente");
                    window.location.href = "https://tecnic-solution.com/";
                } else {
                    const errText = await res.text();
                    console.error("Error submit:", errText);

                    let msg = "Error al enviar evaluación";
                    try {
                        const json = JSON.parse(errText);
                        // Common patterns in ASP.NET Core APIs
                        if (json.errors) {
                            // ValidationProblemDetails
                            msg = Object.values(json.errors).flat().join("\n");
                        } else if (json.message) {
                            msg = json.message;
                        } else if (json.title) {
                            msg = json.title;
                        } else {
                            msg = errText; // Fallback if valid JSON but unknown structure
                        }
                    } catch {
                        // Not JSON, use raw text if not empty
                        if (errText) msg = errText;
                    }
                    alert(msg);
                    
                    // Reactivar botón en error
                    btn.disabled = false;
                    btn.innerText = "Enviar evaluación";
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión: " + error.message);
                
                // Reactivar botón en error
                btn.disabled = false;
                btn.innerText = "Enviar evaluación";
            }
        }

        // Iniciar
        loadEvaluation();
    </script>
</body>
</html>
