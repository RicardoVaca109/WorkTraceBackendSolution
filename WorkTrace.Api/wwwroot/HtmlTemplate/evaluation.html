<!DOCTYPE html>
<html>
<head>
    <title>Evaluación</title>
</head>
<body>
    <h3>Evaluación</h3>

    <canvas id="signature" width="300" height="150"
            style="border:1px solid black"></canvas>
    <br /><br />
    <button onclick="submit()">Enviar</button>

    <script>
        const canvas = document.getElementById("signature");
        const ctx = canvas.getContext("2d");
        let drawing = false;

        canvas.addEventListener("mousedown", () => drawing = true);
        canvas.addEventListener("mouseup", () => drawing = false);
        canvas.addEventListener("mousemove", draw);

        function draw(e) {
            if (!drawing) return;
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        async function submit() {
            const token = sessionStorage.getItem("clientToken");

            const blob = await new Promise(resolve =>
                canvas.toBlob(resolve, "image/png")
            );

            const formData = new FormData();
            formData.append("AssignmentId", "ID");
            formData.append("FormType", "FORM_ID");
            formData.append("SignedBy", "CLIENT");
            formData.append("ClientSignature", blob, "signature.png");
            formData.append("UserEvaluations", JSON.stringify([]));

            await fetch("/api/client-evaluation/submit", {
                method: "POST",
                headers: {
                    "X-Client-Token": token
                },
                body: formData
            });

            alert("Evaluación enviada correctamente");
        }
    </script>
</body>
</html>
