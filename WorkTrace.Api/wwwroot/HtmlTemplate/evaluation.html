<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Evaluación del Servicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        .tech-title {
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 8px;
        }

        .form-title {
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .question {
            margin-bottom: 12px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            height: 160px;
            touch-action: none;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            button:hover {
                background: #125ca1;
            }
    </style>
</head>

<body>
    <h2>Evaluación del Servicio</h2>

    <div id="evaluationContainer"></div>

    <div class="card">
        <p><strong>Firma del cliente</strong></p>
        <canvas id="signature" width="320" height="160"></canvas>
    </div>

    <button onclick="submitEvaluation()">Enviar evaluación</button>

    <script>
        const API_URL = "https://worktraceapi.onrender.com";
        const token = sessionStorage.getItem("clientToken");
        const assignmentId = sessionStorage.getItem("assignmentId");

        let evaluationData = null;

        /* ===============================
           CARGAR FORMULARIOS
        ================================ */
        async function loadEvaluation() {
            const res = await fetch(
                `${API_URL}/api/ClientEvaluation/form/${assignmentId}`,
                { headers: { "X-Client-Token": token } }
            );

            evaluationData = await res.json();
            renderEvaluation(evaluationData);
        }

        function renderEvaluation(data) {
            const container = document.getElementById("evaluationContainer");

            data.evaluations.forEach((e, idx) => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                <div class="tech-title">${e.technicianName}</div>
                <div class="form-title">${e.formName}</div>
                ${e.questions.map((q, qIdx) => `
                    <div class="question">
                        <label>${q.questionText}</label>
                        <input
                            type="${q.answerType === 1 ? 'number' : 'text'}"
                            data-tech="${idx}"
                            data-question="${qIdx}"
                        />
                    </div>
                `).join("")}
            `;

                container.appendChild(card);
            });
        }

        /* ===============================
           FIRMA
        ================================ */
        const canvas = document.getElementById("signature");
        const ctx = canvas.getContext("2d");
        let drawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        canvas.addEventListener("mousedown", e => {
            drawing = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        });

        canvas.addEventListener("mousemove", e => {
            if (!drawing) return;
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        });

        canvas.addEventListener("mouseup", () => drawing = false);
        canvas.addEventListener("touchstart", e => {
            drawing = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        });

        /* ===============================
           SUBMIT
        ================================ */
        async function submitEvaluation() {
            const blob = await new Promise(r => canvas.toBlob(r));

            const formData = new FormData();
            formData.append("FormType", evaluationData.evaluations[0].formTemplateId);
            formData.append("SignedBy", "CLIENTE");
            formData.append("ClientSignature", blob);

            evaluationData.evaluations.forEach((e, i) => {
                formData.append(`UserEvaluations[${i}].UserId`, e.technicianId);

                e.questions.forEach((q, j) => {
                    const input = document.querySelector(
                        `input[data-tech="${i}"][data-question="${j}"]`
                    );

                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].QuestionKey`,
                        q.questionKey
                    );
                    formData.append(
                        `UserEvaluations[${i}].Answers[${j}].AnswerType`,
                        q.answerType
                    );

                    if (q.answerType === 1)
                        formData.append(
                            `UserEvaluations[${i}].Answers[${j}].NumericValue`,
                            input.value
                        );
                    else
                        formData.append(
                            `UserEvaluations[${i}].Answers[${j}].Answer`,
                            input.value
                        );
                });
            });

            const res = await fetch(`${API_URL}/api/ClientEvaluation/submit`, {
                method: "POST",
                headers: { "X-Client-Token": token },
                body: formData
            });

            if (res.ok) alert("Evaluación enviada correctamente");
            else alert("Error al enviar evaluación");
        }

        loadEvaluation();
    </script>
</body>
</html>
