<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Evaluación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        canvas {
            border: 1px solid #000;
            width: 100%;
            max-width: 320px;
            height: 160px;
            touch-action: none;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h3>Evaluación</h3>

    <!-- FIRMA -->
    <p>Firma del cliente:</p>
    <canvas id="signature" width="320" height="160"></canvas>

    <button onclick="submitEvaluation()">Enviar evaluación</button>

    <script>
        /* =======================
           FIRMA (MOUSE + TOUCH)
        ======================= */
        const canvas = document.getElementById("signature");
        const ctx = canvas.getContext("2d");
        let drawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDraw(e) {
            e.preventDefault();
            drawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!drawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000";
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDraw(e) {
            e.preventDefault();
            drawing = false;
            ctx.beginPath();
        }

        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", endDraw);
        canvas.addEventListener("mouseleave", endDraw);

        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", draw, { passive: false });
        canvas.addEventListener("touchend", endDraw);

        /* =======================
           SUBMIT (OPCIÓN A)
        ======================= */
        async function submitEvaluation() {
            const token = sessionStorage.getItem("clientToken");

            if (!token) {
                alert("Sesión inválida");
                return;
            }

            // Convertir firma a imagen
            const blob = await new Promise(resolve =>
                canvas.toBlob(resolve, "image/png")
            );

            const formData = new FormData();

            // ===== CAMPOS PRINCIPALES =====
            formData.append("AssignmentId", "ID_DEL_ASSIGNMENT");
            formData.append("FormType", "ID_DEL_FORMULARIO");
            formData.append("SignedBy", "CLIENTE");
            formData.append("ClientSignature", blob, "signature.png");
            formData.append("ClientComment", "Evaluación completada");

            // ===== USER EVALUATIONS (OPCIÓN A CORRECTA) =====
            // Ejemplo: 1 usuario evaluado con 2 preguntas

            formData.append("UserEvaluations[0].UserId", "USER_ID");

            // Pregunta 1
            formData.append(
                "UserEvaluations[0].Answers[0].QuestionKey",
                "q1"
            );
            formData.append(
                "UserEvaluations[0].Answers[0].QuestionValue",
                "Calidad del servicio"
            );
            formData.append(
                "UserEvaluations[0].Answers[0].AnswerType",
                "Numeric"
            );
            formData.append(
                "UserEvaluations[0].Answers[0].NumericValue",
                "5"
            );

            // Pregunta 2
            formData.append(
                "UserEvaluations[0].Answers[1].QuestionKey",
                "q2"
            );
            formData.append(
                "UserEvaluations[0].Answers[1].QuestionValue",
                "Puntualidad"
            );
            formData.append(
                "UserEvaluations[0].Answers[1].AnswerType",
                "Numeric"
            );
            formData.append(
                "UserEvaluations[0].Answers[1].NumericValue",
                "4"
            );

            const res = await fetch("/api/ClientEvaluation/submit", {
                method: "POST",
                headers: {
                    "X-Client-Token": token
                },
                body: formData
            });

            if (!res.ok) {
                alert("Error al enviar la evaluación");
                return;
            }

            alert("Evaluación enviada correctamente");
        }
    </script>
</body>
</html>
